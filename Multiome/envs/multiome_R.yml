# snRNA-seq (scripts 1-3) and snATAC-seq (scripts 4-6).
# ArchR (v1.0.3) is not on conda; install it inside this environment with:
#   Rscript -e 'devtools::install_github("GreenleafLab/ArchR", ref = "v1.0.3", repos = BiocManager::repositories())'
#   Rscript -e 'devtools::install_github("GreenleafLab/chromVARmotifs")'
name: multiome_R
channels: [conda-forge, bioconda]
dependencies:
  - r-base=4.3
  - bioconductor-dropletutils=1.20.0
  - bioconductor-scuttle=1.10.1
  - r-seurat=4.3.0
  - r-sctransform
  - bioconductor-glmgampoi
  - bioconductor-scater
  - bioconductor-biomart
  - bioconductor-ensdb.hsapiens.v86
  - bioconductor-clusterprofiler
  - bioconductor-org.hs.eg.db
  - r-msigdbr
  - r-openxlsx
  - r-readxl
  - r-dplyr
  - r-ggplot2
  - r-signac
  - bioconductor-genomicranges
  - bioconductor-bsgenome.hsapiens.ucsc.hg38
  - bioconductor-chromvar
  - r-devtools
  - r-biocmanager
